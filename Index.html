
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLCOMP Student Registration Form</title>
</head>
<body>

    <header>
        <h1>COLCOMP Student Registration Form</h1>
        <p>College of Computing student information form</p>
    </header>

    <main>
        <section aria-labelledby="form-heading">
            <h2 id="form-heading">Student Information</h2>
            <p>Please complete all the required fields below.</p>

            <form action="#" method="post">

                <fieldset>
                    <legend>Personal and Academic Details</legend>

                    <p>
                        <label for="name">Full Name:</label><br>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            placeholder="Enter your full name"
                            required>
                    </p>

                    <p>
                        <label for="matric">Matric Number:</label><br>
                        <input
                            type="text"
                            id="matric"
                            name="matric_number"
                            placeholder="Enter your matric number"
                            required>
                    </p>

                    <p>
                        <label for="department">Department:</label><br>
                        <select id="department" name="department" required>
                            <option value="">-- Select Department --</option>
                            <option value="Information and Communication Technology">
                                Information and Communication Technology
                            </option>
                            <option value="Cyber Security">Cyber Security</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Information Technology">
                                Information Technology
                            </option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Information System">Information System</option>
                            <option value="Software Engineering">
                                Software Engineering
                            </option>
                        </select>
                    </p>

                    <p>
                        <label for="email">Email Address:</label><br>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            placeholder="example@email.com"
                            required>
                    </p>

                    <p>
                        <label for="phone">Phone Number:</label><br>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            autocomplete="tel"
                            placeholder="Enter your phone number"
                            required>
                    </p>

                    <p>
                        <label for="gender">Gender:</label><br>
                        <select id="gender" name="gender" required>
                            <option value="">-- Select Gender --</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </p>

                    <p>
                        <label for="programme">Programme:</label><br>
                        <select id="programme" name="programme" required>
                            <option value="">-- Select Programme --</option>
                            <option value="Full-time">Full-time</option>
                            <option value="Part-time (Weekdays)">
                                Part-time (Weekdays)
                            </option>
                            <option value="Part-time (Weekends)">
                                Part-time (Weekends)
                            </option>
                        </select>
                    </p>

                    <button type="submit">Submit Registration</button>

                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; COLCOMP Student Registration Form</p>
    </footer>

</body>
</html>
